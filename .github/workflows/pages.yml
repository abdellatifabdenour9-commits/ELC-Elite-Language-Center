name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          rm -rf docs
          cp -r dist docs
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Deploy to GitHub Pages [skip ci]" || true
          git push origin main

      - name: Configure GitHub Pages
        run: |
          gh api -X PATCH repos/${{ github.repository }}/pages \
            -f 'source.branch=main' \
            -f 'source.path=/docs' \
            || echo "Pages configuration may have already been set or requires manual configuration"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

